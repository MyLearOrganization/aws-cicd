
name: Terraform AWS CI/CD

on:
  push:
    branches:
      - '**'
    paths:
      - 'terraform/**'
      - '.github/workflows/**'

  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.11.0"
  AWS_REGION: "eu-central-1"
  TF_WORKING_DIR: "terraform"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:

  # ==========================================
  # STAGE 1: TERRAFORM VALIDATION
  # Runs on feature branches, PRs and main
  # ==========================================

  validate:
    if: >-
      (github.event_name == 'push' &&
      github.ref != 'refs/heads/main') ||
      github.event_name == 'pull_request'

    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Initialize
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint Initialize
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: tflint --init

      - name: Run TFLint
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: tflint --recursive

  # ==========================================
  # STAGE 2: TERRAFORM PLAN ON FEATURE BRANCHES
  # AND PULL REQUESTS
  # ==========================================

  feature_plan:
    name: Feature Terraform Plan
    if: >-
      (github.event_name == 'push' &&
      github.ref != 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    needs: validate
    uses: ./.github/workflows/terraform-plan.yml
    with:
      aws_role_arn: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
      plan_artifact_name: feature-plan-${{ github.run_id }}
      role_session_name: TerraformFeaturePlan
      tf_working_dir: terraform


  # ==========================================
  # STAGE 3: CHECKOV SECURITY SCAN
  # ==========================================

  security:
    if: >-
      (github.event_name == 'push' &&
       github.ref != 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)    
    name: Feature Security Scan
    needs: feature_plan

    uses: ./.github/workflows/security-scan.yml

    with:
      plan_artifact_name: feature-plan-${{ github.run_id }}
      tf_working_dir: terraform


  # ==========================================
  # STAGE 4: TERRAFORM SECURITY SCAN AND APPLY
  # Only after successful merge into main
  # ==========================================

  production_plan:
    name: Production Terraform Plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/terraform-plan.yml
    with:
      aws_role_arn: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
      plan_artifact_name: production-plan-${{ github.run_id }}
      role_session_name: TerraformProductionPlan
      tf_working_dir: terraform

  production_security:
    name: Production Security Scan
    needs: production_plan

    if: github.ref == 'refs/heads/main'

    uses: ./.github/workflows/security-scan.yml

    with:
      plan_artifact_name: production-plan-${{ github.run_id }}
      tf_working_dir: terraform


  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs:
      - production_plan
      - production_security

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: feature-plan-${{ github.run_id }}
          path: terraform/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: TerraformProductionApply

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Initialize
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -input=false \
            -lock-timeout=5m \
            tfplan.binary
