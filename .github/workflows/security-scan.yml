
name: Reusable Terraform Security Scan

on:
  workflow_call:
    inputs:
      plan_artifact_name:
        description: Terraform plan artifact to scan
        required: true
        type: string

      tf_working_dir:
        description: Terraform working directory
        required: true
        type: string

    outputs:
      checkov_outcome:
        value: ${{ jobs.security_scan.outputs.checkov_outcome }}

      security_findings:
        value: ${{ jobs.security_scan.outputs.security_findings }}

jobs:

  # ==========================================
  # STAGE 1: CHECKOV SECURITY SCAN
  # ==========================================

  security_scan:
    name: Checkov Security Scan
    runs-on: ubuntu-latest

    outputs:
      checkov_outcome: ${{ steps.checkov.outcome }}
      security_findings: ${{ steps.checkov.outputs.security_findings }}
      report_valid: ${{ steps.checkov.outputs.report_valid }}
      checkov_exit_code: ${{ steps.checkov.outputs.checkov_exit_code }}

    steps:
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.plan_artifact_name }}
          path: ${{ inputs.tf_working_dir }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install "checkov==3.2.495"

      - name: Run Checkov Security Scan
        id: checkov
        continue-on-error: true
        working-directory: ${{ inputs.tf_working_dir }}
        run: |
          CHECKOV_EXIT_CODE=0

          checkov -f tfplan.json \
            --framework terraform_plan \
            --output cli \
            --output json \
            --output-file-path . || CHECKOV_EXIT_CODE=$?

          echo "checkov_exit_code=$CHECKOV_EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "finding_count=0" >> "$GITHUB_OUTPUT"

          REPORT="results_json.json"

          if [ ! -f "$REPORT" ] || ! jq -e '.results.failed_checks | type == "array"' "$REPORT" >/dev/null; then
            echo "report_valid=false" >> "$GITHUB_OUTPUT"
            echo "security_findings=false" >> "$GITHUB_OUTPUT"
          else
            echo "report_valid=true" >> "$GITHUB_OUTPUT"

            FAILED_CHECKS=$(jq '.results.failed_checks | length' "$REPORT")
            echo "finding_count=$FAILED_CHECKS" >> "$GITHUB_OUTPUT"

            if [ "$FAILED_CHECKS" -gt 0 ]; then
              echo "security_findings=true" >> "$GITHUB_OUTPUT"
            else
              echo "security_findings=false" >> "$GITHUB_OUTPUT"
            fi
          fi

          exit "$CHECKOV_EXIT_CODE"

      - name: Upload Checkov Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report-${{ github.run_id }}
          path: ${{ inputs.tf_working_dir }}/results_json.json
          retention-days: 3
          if-no-files-found: warn

      - name: Checkov Result Summary
        if: always()
        working-directory: ${{ inputs.tf_working_dir }}
        env:
          SCAN_RESULT: ${{ steps.checkov.outcome }}
        run: |
          echo "### Checkov Security Scan" >> "$GITHUB_STEP_SUMMARY"

          REPORT="results_json.json"

          if [ "$SCAN_RESULT" = "success" ] && [ -f "$REPORT" ]; then
            echo "✅ Security scan passed with no policy violations." >> "$GITHUB_STEP_SUMMARY"

          elif [ "$SCAN_RESULT" = "failure" ] && [ -f "$REPORT" ]; then
            FAILED_CHECKS=$(jq '.results.failed_checks | length' "$REPORT")

            if [ "$FAILED_CHECKS" -gt 0 ]; then
              echo "⚠️ **$FAILED_CHECKS security finding(s) detected.**" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "| Check ID | Resource | Guideline |" >> "$GITHUB_STEP_SUMMARY"
              echo "| :--- | :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"

              jq -r '.results.failed_checks[]? | "| `\(.check_id)` | `\(.resource)` | \(.guideline // "N/A") |"' "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ **Checkov failed without verified security findings.**" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "❌ **Checkov failed or report is missing.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ==========================================
  # STAGE 2: MANUAL SECURITY APPROVAL
  # ==========================================

  security_review:
    name: Manual Security Approval (${{ needs.security_scan.outputs.finding_count }} findings)
    runs-on: ubuntu-latest

    needs: security_scan

    if: >-
      needs.security_scan.outputs.checkov_outcome == 'failure' &&
      needs.security_scan.outputs.checkov_exit_code == '1' &&
      needs.security_scan.outputs.security_findings == 'true' &&
      needs.security_scan.outputs.report_valid == 'true'

    environment:
      name: security-review

    steps:
      - name: Download Checkov Report
        uses: actions/download-artifact@v4
        with:
          name: checkov-report-${{ github.run_id }}
          path: checkov-report

      - name: Display Checkov Findings
        run: |
          echo "### Checkov Findings" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          jq '.' checkov-report/results_json.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm Security Review
        run: echo "GitHub Environment approval has been granted."

  # ==========================================
  # STAGE 3: SECURITY APPROVAL GATE
  # ==========================================

  security_gate:
    name: Security Approval Gate
    runs-on: ubuntu-latest

    needs:
      - security_scan
      - security_review

    if: always()

    steps:
      - name: Evaluate Security Result
        env:
          SCAN_RESULT: ${{ needs.security_scan.outputs.checkov_outcome }}
          FINDINGS: ${{ needs.security_scan.outputs.security_findings }}
          REPORT_VALID: ${{ needs.security_scan.outputs.report_valid }}
          CHECKOV_EXIT_CODE: ${{ needs.security_scan.outputs.checkov_exit_code }}
          REVIEW_RESULT: ${{ needs.security_review.result }}

        run: |
          if [ "$REPORT_VALID" != "true" ]; then
            echo "Security report is missing or invalid."
            exit 1
          fi

          if [ "$SCAN_RESULT" = "success" ] && [ "$FINDINGS" = "false" ]; then
            echo "Checkov passed. Continuing."
            exit 0
          fi

          if [ "$SCAN_RESULT" = "failure" ] &&
             [ "$CHECKOV_EXIT_CODE" = "1" ] &&
             [ "$FINDINGS" = "true" ] &&
             [ "$REVIEW_RESULT" = "success" ]; then
            echo "Security review approved. Continuing."
            exit 0
          fi

          echo "Security scan failed or approval was not granted."
          exit 1
